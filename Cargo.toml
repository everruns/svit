# Svit - agent process runtime research
# Durable design decisions live in knowledge/.

[workspace]
resolver = "2"
members = ["crates/*", "examples/support-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Mykhailo Chalyi <mike@chaliy.name>", "Everruns"]
repository = "https://github.com/everruns/svit"
description = "In-memory agent process runtime"
keywords = ["agent", "runtime", "lisp", "sandbox", "memory"]
categories = ["development-tools", "virtualization"]

[workspace.dependencies]
agentyk = { version = "=0.1.1", default-features = false, features = ["http"] }
async-trait = "0.1"
ketos = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
