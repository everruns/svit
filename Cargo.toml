# Svit - agent process runtime research
# Durable design decisions live in knowledge/.

[workspace]
resolver = "2"
members = ["crates/*", "examples/support-agent-process", "examples/support-agent-svit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Mykhailo Chalyi <mike@chaliy.name>", "Everruns"]
repository = "https://github.com/everruns/svit"
description = "In-memory agent process runtime"
keywords = ["agent", "runtime", "lisp", "sandbox", "memory"]
categories = ["development-tools", "virtualization"]

[workspace.dependencies]
async-trait = "0.1"
dirs = "6"
everruns = { git = "https://github.com/everruns/everruns", branch = "main", default-features = false, features = ["openai"] }
everruns-host = { git = "https://github.com/everruns/everruns", branch = "main", default-features = false }
everruns-test-support = { git = "https://github.com/everruns/everruns", branch = "main", default-features = false, features = ["host", "sim"] }
jaq-core = "3.1"
jaq-json = { version = "2.0", features = ["serde"] }
jaq-std = "3.0"
ketos = "0.12.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
svit-macros = { path = "crates/svit-macros" }
syn = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
turso = { version = "=0.8.0-pre.3", default-features = false }
url = "2"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
