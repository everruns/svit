# Declines install scripts for esbuild and sharp (they ship prebuilds),
# clearing pnpm's build-scripts gate. Adding a package here lets it run scripts.
packages: []
allowBuilds: # pnpm 11
  esbuild: false
  sharp: false
  workerd: false
ignoredBuiltDependencies: # pnpm 10
  - esbuild
  - sharp
  - workerd
# wrangler's miniflare still requests sharp 0.35.4, inside GHSA-wq5f-xc86-pv6w
# (librsvg); 0.35.5 is the patched release. Drop once miniflare requires it.
overrides:
  sharp: 0.35.5
# Only resolve releases at least seven days old.
minimumReleaseAge: 10080
