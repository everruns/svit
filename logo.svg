                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081C3F"/>
      <stop offset="0.55" stop-color="#0A1636"/>
      <stop offset="1" stop-color="#0B1233"/>
    </linearGradient>
    <linearGradient id="gold" x1="256" y1="76" x2="256" y2="296"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2B446"/>
      <stop offset="1" stop-color="#D4A43A"/>
    </linearGradient>
  </defs>

  <g fill="url(#gold)">
