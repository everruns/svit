    <path d="M250 72 H262 L258 140 H254 Z" transform="rotate(24 256 220)"/>
    <path d="M250 72 H262 L258 140 H254 Z" transform="rotate(-48 256 220)"/>
    <path d="M250 72 H262 L258 140 H254 Z" transform="rotate(48 256 220)"/>
