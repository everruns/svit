[package]
name = "svit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["persistence-turso", "turso-mount"]
persistence-turso = ["dep:turso"]
turso-mount = ["dep:turso"]

[dependencies]
async-trait.workspace = true
everruns.workspace = true
everruns-builtins.workspace = true
everruns-core.workspace = true
everruns-host.workspace = true
everruns-provider.workspace = true
jaq-core.workspace = true
jaq-json.workspace = true
jaq-std.workspace = true
ketos.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
svit-macros.workspace = true
thiserror.workspace = true
tokio.workspace = true
turso = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
everruns-test-support.workspace = true
tempfile.workspace = true

[[example]]
name = "transaction_persistence"
required-features = ["persistence-turso"]

[[example]]
name = "mounted_resources"
required-features = ["turso-mount"]
